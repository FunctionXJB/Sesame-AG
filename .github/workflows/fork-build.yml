name: Fork Build
run-name: Fork Build - ${{ github.ref_name }}

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]*-*"

env:
  CI: "true"
  JAVA_DISTRIBUTION: "oracle"
  JAVA_VERSION: "17.0.1"
  ANDROID_API_LEVEL: "37"
  ANDROID_PLATFORM: "android-37.0"
  ANDROID_BUILD_TOOLS: "37.0.0"
  RELEASE_DIR: app/build/outputs/apk/release
  STAGING_DIR: app/build/outputs/apk/all
  PUBLISH_TO_XPOSED_REPO: "false"

concurrency:
  group: fork-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          architecture: x64
          check-latest: false
          cache: gradle

      - name: Pin Gradle Java Home
        shell: bash
        run: |
          set -euo pipefail
          echo "ORG_GRADLE_JAVA_HOME=${JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Print Toolchain Versions
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME}"
          echo "ORG_GRADLE_JAVA_HOME=${ORG_GRADLE_JAVA_HOME}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          java -version
          sdkmanager --version
          ./gradlew --version

      - name: Build Release APKs
        shell: bash
        env:
          OFFICIAL_SIGNING_CERT_SHA256: ${{ vars.OFFICIAL_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -n "${OFFICIAL_SIGNING_CERT_SHA256}" ]]; then
            ./gradlew --no-daemon --stacktrace -PofficialSigningCertSha256="${OFFICIAL_SIGNING_CERT_SHA256}" assembleRelease
          else
            echo "OFFICIAL_SIGNING_CERT_SHA256 未配置，跳过官方证书参数"
            ./gradlew --no-daemon --stacktrace assembleRelease
          fi

      - name: Staging APKs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}"
          # fork 场景仅需 arm64-v8a 产物
          mapfile -t apks < <(find "${RELEASE_DIR}" -maxdepth 1 -type f -name "*arm64-v8a*.apk" | sort)
          if [[ ${#apks[@]} -eq 0 ]]; then
            echo "No arm64-v8a APKs found in ${RELEASE_DIR}" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "${apk}" "${STAGING_DIR}/"
            echo "Staged: $(basename "$apk")"
          done

      - name: Sign APKs
        id: sign_apks
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: ${{ env.STAGING_DIR }}
          signingKey: ${{ secrets.ANDROID_SIGNING_KEY }}
          keyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
          buildToolsVersion: ${{ env.ANDROID_BUILD_TOOLS }}
        continue-on-error: true

      - name: Verify Official APK Signatures
        if: steps.sign_apks.outcome == 'success' && vars.OFFICIAL_SIGNING_CERT_SHA256 != ''
        shell: bash
        run: |
          set -euo pipefail
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner_path="${android_sdk_root}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          if [[ -z "${android_sdk_root}" || ! -x "${apksigner_path}" ]]; then
            echo "Unable to locate apksigner for build-tools ${ANDROID_BUILD_TOOLS}" >&2
            exit 1
          fi

          expected_sha="${{ vars.OFFICIAL_SIGNING_CERT_SHA256 }}"
          echo "Verifying APKs against official cert SHA-256: ${expected_sha}"

          for apk in "${STAGING_DIR}"/*.apk; do
            [[ -f "${apk}" ]] || continue
            echo "Verifying: $(basename "${apk}")"
            cert_output="$("${apksigner_path}" verify --verbose --print-certs "${apk}" 2>&1)"
            actual_sha=$(printf '%s\n' "${cert_output}" | awk -F': ' '/certificate SHA-256 digest:/ { digest=$NF; gsub(/:/, "", digest); print toupper(digest) }')
            if [[ "${actual_sha}" != "${expected_sha}" ]]; then
              echo "Signature mismatch for $(basename "${apk}"): expected=${expected_sha} actual=${actual_sha}" >&2
              exit 1
            fi
            echo "✓ $(basename "${apk}") signature verified"
          done

      - name: Upload Signed APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Sesame-AG-${{ github.ref_name }}
          path: ${{ env.STAGING_DIR }}/*.apk
          if-no-files-found: error
          retention-days: 30